<html>
    <head>
        <title>Web App Kero-Kero</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <body>        
        <div class="container">
            <h2>Controle de Produtos (CADASTRAR)</h2>
            <form method="post" action="prod_cad.jsp">
                <!--<p>Identificador <input type="number" name="id"> </p> -->
                <p>Nome do Produto <input type="text" name="prod" placeholder="Sovado"> </p>
                <p>Descrição <input type="text" name="desc" placeholder="Pão Sovado 200g"> </p>
                <p>Preço unitário <input type="number" name="prc" step="0.01" min="0" placeholder="0.00"></p>
                <p>Quantidade <input type="number" name="qtd" placeholder="22"> </p>
                
                <p> <input type="submit" value="Cadastrar">
                    <input type="reset" value="Limpar">
                </p>
            </form>
        </div>
    </body>
